<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Glam by Dina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-1000: #FFB6C1;
            --gold: #FFC300;
            --dark-gray: #333333;
            --white: #FFFFFF;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #F5F5F5;
            color: var(--dark-gray);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .content {
            max-width: 600px;
            padding: 40px;
            background-color: var(--white);
            border-radius: 8px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.08);
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--pink-1000);
            margin-bottom: 20px;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        .btn {
            display: inline-block;
            background-color: var(--pink-1000);
            color: var(--white);
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>404</h1>
        <p>Oops! The page you're looking for seems to have vanished. Let's get you back to somewhere beautiful.</p>
        <a href="/" class="btn">Return to Homepage</a>
    </div>
</body>
</html>
