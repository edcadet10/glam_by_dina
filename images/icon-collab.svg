<?xml version="1.0" encoding="UTF-8"?>
<svg width="80px" height="80px" viewBox="0 0 80 80" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Brand Collaboration Icon</title>
    <defs>
        <linearGradient id="collabGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFB6C1" />
            <stop offset="100%" stop-color="#FFC300" />
        </linearGradient>
    </defs>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Hands Shaking -->
        <g id="handshake" transform="translate(10, 20)">
            <!-- Left Hand -->
            <path id="left-hand" d="M0,20 C5,20 10,25 15,25 C20,25 20,20 25,20" stroke="url(#collabGradient)" stroke-width="5" stroke-linecap="round" fill="none">
                <animate attributeName="d" 
                    values="M0,20 C5,20 10,25 15,25 C20,25 20,20 25,20; 
                           M0,20 C5,20 10,23 15,23 C20,23 20,20 25,20; 
                           M0,20 C5,20 10,25 15,25 C20,25 20,20 25,20" 
                    dur="2s" 
                    repeatCount="indefinite" />
            </path>
            
            <!-- Right Hand -->
            <path id="right-hand" d="M60,20 C55,20 50,25 45,25 C40,25 40,20 35,20" stroke="url(#collabGradient)" stroke-width="5" stroke-linecap="round" fill="none">
                <animate attributeName="d" 
                    values="M60,20 C55,20 50,25 45,25 C40,25 40,20 35,20; 
                           M60,20 C55,20 50,23 45,23 C40,23 40,20 35,20; 
                           M60,20 C55,20 50,25 45,25 C40,25 40,20 35,20" 
                    dur="2s" 
                    repeatCount="indefinite" />
            </path>
            
            <!-- Connection Point Highlight -->
            <circle id="connection" cx="30" cy="20" r="5" fill="url(#collabGradient)" opacity="0.8">
                <animate attributeName="r" 
                    values="5;7;5" 
                    dur="2s" 
                    repeatCount="indefinite" />
                <animate attributeName="opacity" 
                    values="0.8;1;0.8" 
                    dur="2s" 
                    repeatCount="indefinite" />
            </circle>
        </g>
        
        <!-- Stars - Success Indicators -->
        <circle id="star1" cx="15" cy="15" r="2" fill="#FFC300">
            <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
        </circle>
        
        <circle id="star2" cx="60" cy="15" r="2" fill="#FFC300">
            <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.5s" repeatCount="indefinite" />
        </circle>
        
        <circle id="star3" cx="40" cy="10" r="2" fill="#FFC300">
            <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite" />
        </circle>
        
        <circle id="star4" cx="20" cy="60" r="2" fill="#FFC300">
            <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.5s" repeatCount="indefinite" />
        </circle>
        
        <circle id="star5" cx="65" cy="55" r="2" fill="#FFC300">
            <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2s" repeatCount="indefinite" />
        </circle>
    </g>
</svg>