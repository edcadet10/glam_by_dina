<?xml version="1.0" encoding="UTF-8"?>
<svg width="80px" height="80px" viewBox="0 0 80 80" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Social Media Strategy Icon</title>
    <defs>
        <linearGradient id="socialGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFB6C1" />
            <stop offset="100%" stop-color="#FFC300" />
        </linearGradient>
    </defs>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Network Nodes -->
        <circle id="node1" cx="40" cy="20" r="7" fill="url(#socialGradient)">
            <animate attributeName="r" values="7;8;7" dur="3s" repeatCount="indefinite" />
        </circle>
        
        <circle id="node2" cx="20" cy="50" r="7" fill="url(#socialGradient)">
            <animate attributeName="r" values="7;8;7" dur="3s" begin="0.5s" repeatCount="indefinite" />
        </circle>
        
        <circle id="node3" cx="60" cy="50" r="7" fill="url(#socialGradient)">
            <animate attributeName="r" values="7;8;7" dur="3s" begin="1s" repeatCount="indefinite" />
        </circle>
        
        <circle id="node4" cx="40" cy="65" r="5" fill="url(#socialGradient)">
            <animate attributeName="r" values="5;6;5" dur="3s" begin="1.5s" repeatCount="indefinite" />
        </circle>
        
        <!-- Connection Lines -->
        <line id="line1-2" x1="40" y1="20" x2="20" y2="50" stroke="url(#socialGradient)" stroke-width="2" opacity="0.7">
            <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
        </line>
        
        <line id="line1-3" x1="40" y1="20" x2="60" y2="50" stroke="url(#socialGradient)" stroke-width="2" opacity="0.7">
            <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="0.5s" repeatCount="indefinite" />
        </line>
        
        <line id="line2-4" x1="20" y1="50" x2="40" y2="65" stroke="url(#socialGradient)" stroke-width="2" opacity="0.7">
            <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="1s" repeatCount="indefinite" />
        </line>
        
        <line id="line3-4" x1="60" y1="50" x2="40" y2="65" stroke="url(#socialGradient)" stroke-width="2" opacity="0.7">
            <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="1.5s" repeatCount="indefinite" />
        </line>
        
        <!-- Data Flow Animation -->
        <circle id="data-packet1" r="2" fill="#FFFFFF">
            <animateMotion path="M40,20 L20,50" dur="2s" repeatCount="indefinite" />
        </circle>
        
        <circle id="data-packet2" r="2" fill="#FFFFFF">
            <animateMotion path="M40,20 L60,50" dur="2s" begin="0.7s" repeatCount="indefinite" />
        </circle>
        
        <circle id="data-packet3" r="2" fill="#FFFFFF">
            <animateMotion path="M20,50 L40,65" dur="2s" begin="1.4s" repeatCount="indefinite" />
        </circle>
        
        <circle id="data-packet4" r="2" fill="#FFFFFF">
            <animateMotion path="M60,50 L40,65" dur="2s" begin="2.1s" repeatCount="indefinite" />
        </circle>
    </g>
</svg>