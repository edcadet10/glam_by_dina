<?xml version="1.0" encoding="UTF-8"?>
<svg width="80px" height="80px" viewBox="0 0 80 80" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Photography Icon</title>
    <defs>
        <linearGradient id="photoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFB6C1" />
            <stop offset="100%" stop-color="#FFC300" />
        </linearGradient>
    </defs>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Camera Body -->
        <rect id="camera-body" x="15" y="25" width="50" height="35" rx="3" fill="url(#photoGradient)">
            <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite" />
        </rect>
        
        <!-- Flash -->
        <rect id="flash" x="25" y="20" width="15" height="5" rx="1" fill="#FFFFFF">
            <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
        </rect>
        
        <!-- Lens -->
        <circle id="lens-outer" cx="40" cy="42.5" r="15" fill="#333333">
            <animate attributeName="r" values="15;15.5;15" dur="3s" repeatCount="indefinite" />
        </circle>
        <circle id="lens-inner" cx="40" cy="42.5" r="12" fill="#666666">
            <animate attributeName="r" values="12;12.5;12" dur="3s" repeatCount="indefinite" />
        </circle>
        <circle id="lens-glass" cx="40" cy="42.5" r="8" fill="#111111">
            <animate attributeName="r" values="8;8.5;8" dur="3s" repeatCount="indefinite" />
        </circle>
        
        <!-- Camera Button -->
        <circle id="button" cx="60" cy="32" r="3" fill="#FFFFFF">
            <animate attributeName="r" values="3;3.2;3" dur="2s" repeatCount="indefinite" />
        </circle>
        
        <!-- Shutter Animation -->
        <path id="shutter" d="M40,42.5 L40,42.5" stroke="#FFFFFF" stroke-width="1" opacity="0">
            <animate id="shutter-open" 
                attributeName="d" 
                values="M40,42.5 L40,42.5; M29,32 L51,53; M40,42.5 L40,42.5" 
                dur="5s" 
                repeatCount="indefinite" />
            <animate attributeName="opacity" 
                values="0;0.7;0" 
                dur="5s" 
                repeatCount="indefinite" />
        </path>
    </g>
</svg>