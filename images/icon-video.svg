<?xml version="1.0" encoding="UTF-8"?>
<svg width="80px" height="80px" viewBox="0 0 80 80" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Video Production Icon</title>
    <defs>
        <linearGradient id="videoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFB6C1" />
            <stop offset="100%" stop-color="#FFC300" />
        </linearGradient>
    </defs>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Camera Body -->
        <rect id="camera-body" x="10" y="20" width="50" height="35" rx="4" fill="url(#videoGradient)">
            <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
        </rect>
        
        <!-- Camera Lens -->
        <circle id="camera-lens" cx="30" cy="37.5" r="12" fill="#FFFFFF" opacity="0.7">
            <animate attributeName="r" values="12;13;12" dur="2s" repeatCount="indefinite" />
        </circle>
        <circle id="lens-inner" cx="30" cy="37.5" r="8" fill="#333333" opacity="0.9">
            <animate attributeName="r" values="8;9;8" dur="2s" repeatCount="indefinite" />
        </circle>
        
        <!-- Record Light -->
        <circle id="record-light" cx="55" cy="27" r="3" fill="#FF3333">
            <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite" />
        </circle>
        
        <!-- Film Roll -->
        <path id="film-roll" d="M60,25 L75,15 L75,45 L60,35 Z" fill="url(#videoGradient)">
            <animateTransform attributeName="transform" 
                type="rotate" 
                from="0 60 30" 
                to="-5 60 30" 
                dur="2s" 
                repeatCount="indefinite" 
                additive="sum" />
        </path>
    </g>
</svg>